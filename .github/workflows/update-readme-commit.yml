name: Update README with commit message

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'Обработки/**'
      - '.github/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужно для получения полной истории коммитов

      - name: Get full commit message
        id: commit
        run: |
          # Сохраняем всё сообщение коммита (subject + body) в переменную
          git log -1 --format='%B' > commit_msg.txt
          # Первая строка (subject)
          first_line=$(head -n1 commit_msg.txt)
          # Остальные строки (body), если они есть
          tail -n +2 commit_msg.txt > commit_body.txt
          # Записываем в GITHUB_OUTPUT
          echo "subject=$first_line" >> $GITHUB_OUTPUT
          # Для body используем heredoc, чтобы сохранить переносы
          {
            echo 'body<<EOF'
            cat commit_body.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Check for "Релиз" in commit message
        id: check
        run: |
          # Проверяем наличие слова "Релиз" в subject или body
          if grep -qi "Релиз" commit_msg.txt; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Слово 'Релиз' найдено в сообщении коммита" >> $GITHUB_STEP_SUMMARY
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Слово 'Релиз' НЕ найдено в сообщении коммита, пропускаем обновление README" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prepend commit info to README.md
        if: steps.check.outputs.found == 'true'
        run: |
          # Формируем новый блок
          NEW_BLOCK=$(cat <<-END
          # ⚡ ${{ steps.commit.outputs.subject }}

          ${{ steps.commit.outputs.body }}

          
          END
          )

          # Добавляем пустую строку в конце блока
          if [ -s commit_body.txt ]; then
            # Если есть body, оставляем как есть
            printf "%s\n\n%s\n" "$NEW_BLOCK" "$(cat README.md)" > README.md
          else
            # Если body пустой, просто записываем subject и пустую строку
            printf "# ⚡ %s\n\n\n%s\n" "${{ steps.commit.outputs.subject }}" "$(cat README.md)" > README.md
          fi

      - name: Commit and push changes
        if: steps.check.outputs.found == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README with release info [skip ci]"
          file_pattern: README.md
